name: RADAR · barrido JobSpy

# GitHub retrasa las tareas programadas cuando tiene carga: el 2-sep se pidió
# a las 04:00 UTC y se ejecutó a las 08:25 — cuatro horas y media tarde. El
# digest de RADAR sale a las 09:00 de Madrid (07:00 UTC), así que con ese
# retraso leía datos del día anterior.
#
# Solución: pedirlo a las 23:00 UTC del día previo (01:00 de Madrid). Aunque
# GitHub lo retrase cinco horas, sigue terminando antes de las 04:00 UTC, muy
# por delante del digest. Y se añade un segundo intento a las 02:00 UTC por si
# el primero no llegó a ejecutarse: el barrido es idempotente y la salvaguarda
# de las 20 ofertas impide que un run flojo pise uno bueno.
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para que el bot pueda hacer commit

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install python-jobspy pandas

      - name: Ejecutar el barrido
        run: python3 jobspy_radar.py
        continue-on-error: true      # un fallo parcial no debe romper el commit

      - name: Publicar el CSV que lee RADAR
        run: |
          set -e
          ULTIMO=$(ls -t resultados/radar_*.csv 2>/dev/null | head -1)
          if [ -z "$ULTIMO" ]; then
            echo "Sin CSV nuevo: el barrido no produjo resultados. No se toca latest.csv."
            exit 0
          fi
          FILAS=$(( $(wc -l < "$ULTIMO") - 1 ))
          echo "Barrido: $FILAS ofertas en $ULTIMO"

          # Salvaguarda: no sustituir un latest.csv bueno por uno vacío o roto.
          if [ "$FILAS" -lt 20 ]; then
            echo "Solo $FILAS ofertas — sospechoso (bloqueo o rate-limit)."
            echo "Se conserva el latest.csv anterior."
            exit 0
          fi
          cp "$ULTIMO" resultados/latest.csv
          echo "FILAS=$FILAS" >> $GITHUB_ENV

      - name: Guardar en el repositorio
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add resultados/ || true
          git diff --staged --quiet && echo "Sin cambios" || \
            git commit -m "Barrido $(date -u +%Y-%m-%d): ${FILAS:-?} ofertas"
          git push
